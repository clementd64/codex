syntax = "proto3";
package codex.game;
option go_package = "github.com/clementd64/codex/internal/game/proto;game";

service GameService {
  rpc Search(SearchRequest) returns (SearchResponse) {}
}

message SearchRequest {
  string query = 1;
  int32 page = 2;
}

message SearchResponse {
  repeated SearchGame results = 1;
  int32 page = 2;
  int32 total_pages = 3;
}

message SearchGame {
  int32 id = 1;
  string name = 2;
  optional string cover = 3;
  repeated Platform platforms = 4;
  optional string release_date = 5;
  bool added = 6;
}

message Platform {
  int64 id = 1;
  string name = 2;
  string abbreviation = 3;
}
