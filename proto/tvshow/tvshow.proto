syntax = "proto3";
package codex.tvshow;
option go_package = "github.com/clementd64/codex/internal/tvshow/proto;tvshow";

import "google/protobuf/empty.proto";

service TvShowService {
  rpc List(ListRequest) returns (ListResponse) {}
  rpc Search(SearchRequest) returns (SearchResponse) {}
  rpc Add(AddRequest) returns (google.protobuf.Empty) {}
  rpc Delete(DeleteRequest) returns (google.protobuf.Empty) {}
}

message ListRequest {}

message ListResponse {
  repeated TvShow results = 1;
}

message TvShow {
  string id = 1;
  string name = 2;
  optional string poster = 3;
  optional string firstAirDate = 4;
  optional string country = 5;
  optional string originalName = 7;
}

message SearchRequest {
  string query = 1;
  optional int32 page = 2;
}

message SearchResponse {
  repeated SearchTvShow results = 1;
  int32 page = 2;
  int32 totalPages = 3;
}

message SearchTvShow {
  int32 tmdbId = 1;
  string name = 2;
  optional string poster = 3;
  optional string firstAirDate = 4;
  optional string country = 5;
  optional string originalName = 7;
  bool added = 8;
}

message AddRequest {
  int32 tmdbId = 1;
}

message DeleteRequest {
  string id = 1;
}
